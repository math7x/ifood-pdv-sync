<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>iFood PDV Sync</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; width: 320px; padding: 14px; color: #e9e9ec; background: #17181c; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #e9e9ec; }
  p.sub { font-size: 12px; color: #9a9aa5; margin: 0 0 14px; }
  .step { margin-bottom: 14px; }
  .step label { display:block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #e9e9ec; }
  input[type=file] { font-size: 12px; width: 100%; color: #e9e9ec; }
  button { width: 100%; padding: 9px 10px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  #btnStart { background: #ff4757; color: #fff; }
  #btnStart:disabled { background: #3a3d44; color: #85868d; cursor: not-allowed; }
  .status { font-size: 12px; margin-top: 8px; padding: 8px; border-radius: 6px; background: #24262b; color: #e9e9ec; line-height: 1.4; }
  .status.ok { background: #1e3c2c; color: #8fe0b0; }
  .status.err { background: #4a2020; color: #ff8790; }
  .hint { font-size: 11px; color: #85868d; margin-top: 6px; }
  .divider { border-top: 1px solid #2c2e34; margin: 14px 0; }
</style>
</head>
<body>
  <h1>iFood PDV Sync</h1>
  <p class="sub">Casa os códigos da planilha Saipos com o cardápio PDV do iFood e revisa antes de aplicar.</p>

  <div class="step">
    <label>1. Planilha Saipos (.xlsx)</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" />
    <div id="fileStatus" class="status" style="display:none;"></div>
  </div>

  <div class="divider"></div>

  <div class="step">
    <label>2. Confirme que já preencheu os códigos PAI de todos os itens no portal iFood</label>
    <button id="btnStart" disabled>Verificar cardápio e sugerir códigos</button>
    <div class="hint">Nada é escrito no cardápio nesta etapa — só é feita uma leitura e um relatório de sugestões, que você revisa e aprova na própria página do PDV.</div>
  </div>

  <div id="runStatus" class="status" style="display:none;"></div>

  <script src="lib/xlsx.core.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
